name: 'nyc_analytics'
version: '1.0.0'
config-version: 2
# Some default settings for dbt
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
 - "target"
 - "dbt_packages"

# Set up models, which are basically SQL files, to create tables
models:
 nyc_analytics:
   +materialized: table

   project_group2_work:
     staging:
       +materialized: table
       +schema: nyc_parking_staging

     marts:
       +materialized: table
       +schema: nyc_parking_data_warehouse
      
       conformed:
         +materialized: table
      
       311_illegal_parking:
          +materialized: table

       open_parking:
         +materialized: table


